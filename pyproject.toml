[project]
name = "task-app-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tom van der Lee" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "flask>=3.1.3",
    "pyjwt[crypto]>=2.15.1",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]

[project.scripts]
task-app-api = "task_app_api:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
]
